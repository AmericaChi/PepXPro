[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pepxpro"
version = "0.1.0"
description = "PepXPro — peptide-protein benchmark pipeline for PDBbind."
requires-python = ">=3.10"

[project.scripts]
pepxpro = "pepxpro:main"

[tool.setuptools]
py-modules = ["pepxpro"]
